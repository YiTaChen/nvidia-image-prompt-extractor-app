[project]
name = "visual-prompt-studio-backend"
version = "0.1.0"
description = "Backend for extracting prompts from images, generating images, and refining prompts across AI providers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
